plugins {
    id 'com.android.application'
}

android {
    namespace 'co.guardiania.app'
    compileSdk 34

    defaultConfig {
        applicationId "co.guardiania.app"
        minSdk 26          // Android 8: primera versión con servicios en primer plano estables
        targetSdk 34
        // Solo procesadores ARM (todos los celulares): el motor de Tor y WireGuard no se empaquetan para
        // x86 (emuladores), así el APK pesa ~15 MB menos.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        versionCode 20
        versionName "2.0.0"
    }

    buildTypes {
        release {
            // R8 activo en release: APK más pequeño y código más difícil de leer para un atacante.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.2'   // registerForActivityResult
    implementation 'androidx.core:core:1.13.1'
    // Huella / rostro para abrir la app (bloqueo biométrico opcional).
    implementation 'androidx.biometric:biometric:1.1.0'
    // Ubicación fusionada de Google: más precisa y con menos batería que el GPS crudo.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'

    // Escáner de QR con la cámara (CameraX + ML Kit, funciona sin conexión).
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Mapa OpenStreetMap (osmdroid): sin Google, sin clave de API, igual que el PC.
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    // VPN: motor oficial de WireGuard (wireguard-go en espacio de usuario, sobre VpnService de Android).
    // Es el mismo que usa la app «WireGuard» de Play Store (el desugaring ya está activado arriba).
    implementation 'com.wireguard.android:tunnel:1.0.20230706'
    // Tor integrado (oficial, Guardian Project): el mismo motor de Orbot, dentro de GuardianIA.
    // 0.4.8.16: la 0.4.9.x viene compilada con Java 24 y AGP 8.5 no la acepta.
    implementation 'info.guardianproject:tor-android:0.4.8.16'
    implementation 'info.guardianproject:jtorctl:0.4.5.7'

    // Pruebas de la IA del teléfono (Java puro, corren en el PC sin emulador).
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
